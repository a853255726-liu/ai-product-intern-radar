name: Verify Huawei campus internships filter

on:
  push:
    branches: [main]
    paths:
      - probe_huawei_jobs.py
      - .github/workflows/probe-huawei-jobs.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install chromium --with-deps
      - name: Confirm public intern filter changes job feed
        shell: bash
        run: |
          set -o pipefail
          python probe_huawei_jobs.py 2>&1 | tee huawei-list.log
      - name: Save source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: huawei-recruitment-intern-filter
          path: huawei-list.log
          if-no-files-found: warn
          retention-days: 7
