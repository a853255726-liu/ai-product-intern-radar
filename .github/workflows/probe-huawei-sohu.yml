name: Investigate Huawei and Sohu public internship systems

on:
  push:
    branches: [main]
    paths:
      - probe_huawei_sohu.py
      - .github/workflows/probe-huawei-sohu.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        site: [huawei, sohu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install chromium --with-deps
      - name: Read public recruitment UI structure
        shell: bash
        run: |
          set -o pipefail
          python probe_huawei_sohu.py --site "${{ matrix.site }}" 2>&1 | tee inspection.log
      - name: Preserve sanitized public browser findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: employer-interface-${{ matrix.site }}
          path: inspection.log
          if-no-files-found: warn
          retention-days: 7
