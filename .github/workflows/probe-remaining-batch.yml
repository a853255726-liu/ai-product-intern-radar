name: Inspect remaining first-batch official career sites

on:
  push:
    branches: [main]
    paths:
      - probe_remaining_batch.py
      - .github/workflows/probe-remaining-batch.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-dom-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        site: [autohome, huawei, sohu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public browser
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install chromium --with-deps
      - name: Inspect official public recruitment interface
        shell: bash
        run: |
          set -o pipefail
          python probe_remaining_batch.py --site "${{ matrix.site }}" 2>&1 | tee probe.log
      - name: Save bounded recruiter-site DOM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-probe-${{ matrix.site }}
          path: probe.log
          if-no-files-found: warn
          retention-days: 7
