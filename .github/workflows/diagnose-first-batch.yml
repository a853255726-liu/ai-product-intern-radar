name: Diagnose first-batch internship sources

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: tal-moka
            employer: TAL
          - source: oppo-daily
            employer: OPPO
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install public browser
        run: python -m playwright install chromium --with-deps
      - name: Check collector syntax and contracts
        run: |
          python -m compileall -q tal_sources.py oppo_sources.py refresh_sources.py tests
          python -m unittest discover -s tests -p 'test_first_batch_*.py' -v
      - name: Check source without writing job snapshots
        shell: bash
        run: |
          set -o pipefail
          python refresh_sources.py --audit-only --sources "${{ matrix.source }}" 2>&1 | tee audit.log
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-batch-${{ matrix.source }}
          path: audit.log
          if-no-files-found: ignore
          retention-days: 7
