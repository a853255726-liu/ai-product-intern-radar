name: Source code and regression tests

on:
  push:
    branches: [main]
    paths:
      - '**/*.py'
      - 'requirements.txt'
      - '.github/workflows/source-tests.yml'
  workflow_dispatch:

permissions:
  contents: write

# Keep only the newest source check on main. Older concurrent runs can
# otherwise race while committing the same ci_health.json file.
concurrency:
  group: source-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile all Python modules
        run: python -m compileall -q .
      - name: Run offline regression suite
        id: regress
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee source-tests.log
      - name: Write checked commit and regression outcome
        if: always()
        env:
          CI_TEST_OUTCOME: ${{ steps.regress.outcome }}
        run: python ci_health_report.py
      - name: Persist independent source test result
        if: always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # The report is generated in this checked-out test run, while the
          # target branch may have moved. Save the report before refreshing.
          cp data/ci_health.json "$RUNNER_TEMP/ci-health-report.json"
          for attempt in 1 2 3; do
            git fetch origin main
            # Safe here: the runner is ephemeral and only the report is
            # persisted. Never rewrite or force-push someone else's work.
            git reset --hard origin/main
            mkdir -p data
            cp "$RUNNER_TEMP/ci-health-report.json" data/ci_health.json
            git add data/ci_health.json
            git diff --cached --quiet && exit 0
            git commit -m 'ci: record offline source regression result'
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo "CI report could not be written, consult attached test logs."
          exit 1
      - name: Fail on compilation or regression errors
        if: always() && steps.regress.outcome != 'success'
        run: |
          echo "Source regression did not pass; read source-tests.log and data/ci_health.json"
          exit 1
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-test-log
          path: source-tests.log
          if-no-files-found: ignore
          retention-days: 14
