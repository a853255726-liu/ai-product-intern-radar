name: Diagnose Sohu official Moka vacancies

on:
  push:
    branches: [main]
    paths:
      - probe_sohu_moka.py
      - .github/workflows/probe-sohu-moka.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install chromium --with-deps
      - name: Verify Sohu employer Moka public list
        shell: bash
        run: |
          set -o pipefail
          python probe_sohu_moka.py 2>&1 | tee sohu-moka.log
      - name: Save result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-sohu-moka-browser
          path: sohu-moka.log
          if-no-files-found: warn
          retention-days: 7
